name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }}, rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Tests, examples, and lints run on stable only, so dev-dependencies are free to need newer Rust.
        # What consumers build is checked on the MSRV by the `msrv` job.
        rust: [stable]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy lints
        # `--workspace` would include `mtp-bench` (needs libmtp via pkg-config,
        # not installed on CI runners). Default-members in root Cargo.toml
        # scopes to the lib + CLI only.
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Run tests with all features
        run: cargo test --all-features

      - name: Build documentation
        run: cargo doc --no-deps

  windows-wpd:
    name: Windows WPD backend + conformance
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain (stable MSVC)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # Default-feature build type-checks the WPD-over-COM backend (compiled via
      # cfg(windows)); it isn't exercised on the Linux/macOS jobs.
      - name: Build mtp-rs (default features, type-checks WpdBackend)
        run: cargo build -p mtp-rs

      # Build the default members (mtp-rs + CLI) and all their targets on Windows. We omit
      # `--workspace` so it respects default-members, which excludes mtp-bench (needs libmtp via
      # pkg-config and isn't a CI target) — matching the other jobs above.
      - name: Build default members (all targets)
        run: cargo build --all-targets

      # Backend-conformance parity suite against the virtual device. The real-device
      # `conformance_wpd` tests are `#[ignore]`, so a normal run skips them (no phone on CI).
      - name: Run virtual-device conformance suite
        run: cargo test -p mtp-rs --features virtual-device --test conformance

  # Catches accidental API breaks against the latest `mtp-rs` on crates.io. Only the default-feature surface: the
  # `unstable-raw`, `virtual-device`, and `tracing` features are exempt from SemVer. A deliberate break passes once the
  # version in Cargo.toml says so. See `just semver`.
  semver:
    name: Check SemVer against crates.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          # Same version as `just install-tools`. Keep at least three days old when bumping.
          tool: cargo-semver-checks@0.51.0

      - name: Check for accidental API breaks
        run: cargo semver-checks --package mtp-rs --default-features

  # The MSRV promise covers what a consumer compiles: the library (every feature) and the CLI binary. Tests and
  # dev-dependencies are ours alone, so they're held to stable, not to the MSRV. Each OS, for the `cfg`-gated code.
  # It resolves dependencies afresh the way a consumer on the MSRV does, so the committed Cargo.lock (kept current by
  # Renovate) never has to stay MSRV-compatible. See docs/dependency-updates.md.
  msrv:
    name: Verify MSRV (1.91, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with rust-version in Cargo.toml. Renovate leaves it alone on purpose; see
          # docs/dependency-updates.md for everything an MSRV raise touches.
          toolchain: "1.91"

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Resolve dependencies like a consumer on the MSRV
        # `fallback` makes the resolver pick the newest version whose rust-version fits ours.
        run: cargo update
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

      - name: Check compilation on MSRV (published crates only)
        # MSRV is a contract for downstream consumers of the published crates,
        # not for the internal mtp-bench benchmark crate (which depends on
        # libmtp-rs / comfy-table requiring newer Rust).
        run: cargo check -p mtp-rs -p mtp-rs-cli --all-features
        env:
          RUSTFLAGS: "-D warnings"
