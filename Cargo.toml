[workspace]
resolver = "2"
members = [
    "crates/mtp-rs",
    "crates/mtp-rs-cli",
    "benchmarks/mtp-rs-vs-libmtp",
]
# `mtp-bench` depends on `libmtp-sys` (C library bindings via pkg-config).
# It's a manual dev tool, not a CI target. Excluding it from default-members
# means bare `cargo test` / `cargo clippy` skip it. Build it explicitly with
# `cargo test -p mtp-bench` when you have libmtp installed locally.
default-members = [
    "crates/mtp-rs",
    "crates/mtp-rs-cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vdavid/mtp-rs"
authors = ["David Veszelovszki <veszelovszki@gmail.com>"]

[workspace.lints.clippy]
# Inherit clippy.toml at the workspace root.

# The profile `dist` builds release binaries with (see dist-workspace.toml).
[profile.dist]
inherits = "release"
lto = "thin"
