# deny.toml - cargo-deny configuration for mtp-rs
#
# Run with: cargo deny check
# Documentation: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true
# The libmtp comparison benchmark is a manual dev tool: never published, never built by CI, and its
# libmtp-rs pulls in unmaintained crates (derivative, chrono) we can't move. Checking it would only
# add ignores that also mute those advisories for the crates we ship. cargo-audit can't scope by
# package, so it ignores them by id instead, in `.cargo/audit.toml`.
exclude = ["mtp-bench"]

[advisories]
# An ignore that no longer matches anything fails the check, so it can't outlive its reason.
unused-ignored-advisory = "deny"
ignore = []

[licenses]
confidence-threshold = 0.8
# Only list licenses actually used by dependencies to avoid warnings
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Unicode-3.0",
    "CC0-1.0",
    "ISC",
]

[bans]
multiple-versions = "allow"  # Transitive deps often have duplicates we can't control
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
