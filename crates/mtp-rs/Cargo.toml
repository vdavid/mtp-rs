[package]
name = "mtp-rs"
version = "0.29.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Pure-Rust MTP (Media Transfer Protocol) library for modern Android devices"
keywords = ["mtp", "android", "usb", "media", "transfer"]
categories = ["hardware-support", "filesystem"]
readme = "README.md"
documentation = "https://docs.rs/mtp-rs"
exclude = [
    "proptest-regressions/",
]

[package.metadata.docs.rs]
all-features = true

[dependencies]
# USB transport (Phase 3+)
# Floor is 0.2.5, not 0.2, because two fixes below that are ones we'd hit:
# 0.2.4 fixes a deadlock in `wait_next_complete` when completion callbacks arrive
# out of order (the exact allocate/submit/wait_next_complete path
# `send_bulk_streaming` uses for uploads), and 0.2.5 fixes a macOS memory leak in
# `control_in` (the SIC cancel and DEVICE_RESET path). A lockfile bump would only
# fix this repo; the floor is what makes consumers get them too.
nusb = "0.2.5"

# Async runtime agnostic
futures = "0.3"
futures-timer = "3.0"
async-trait = "0.1"

# Byte handling
bytes = "1.5"

# Filesystem watching for virtual device
notify = { version = "8", optional = true }

# For thiserror derive
thiserror = "2"

# Enum conversion derives
num_enum = "0.7"

# Optional structured diagnostics (facade only, runtime-agnostic). Enabled by
# the `tracing` feature; the subscriber is the consumer's choice.
tracing = { version = "0.1", optional = true }

# Windows WPD (Windows Portable Devices) COM backend. Pure-Rust projection, no C deps / no SDK
# import libs needed (links system COM DLLs via raw-dylib). See docs/windows-wpd-backend-plan.md.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_PortableDevices",
    # CfgMgr32 device-tree walk: correlate an nusb USB device to its WPD device by serial.
    "Win32_Devices_DeviceAndDriverInstallation",
] }
# Direct dep (same version `windows` already pulls in transitively) so the `#[implement]` macro's
# generated `::windows_core` paths resolve — used to implement the WPD event callback COM object.
windows-core = "=0.62.2"

[dev-dependencies]
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time", "fs", "io-util"] }
proptest = "1"
serial_test = "3.1"
parking_lot = "0.12"  # Used by MockTransport
tempfile = "3"

[features]
default = []
virtual-device = ["notify"]
# Opt-in structured diagnostics. Emits `tracing` events on the transaction and
# cancel/reset paths so a bug reporter can capture what their device does with
# `RUST_LOG=mtp_rs=debug` (issue #18). Off by default: no dependency, no cost.
tracing = ["dep:tracing"]
