[package]
name = "mtp-rs-cli"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Override the workspace `authors` field so Dmitry, who contributed the
# initial CLI in #11, is credited on the crates.io page alongside the
# maintainer. The workspace default lists the maintainer only.
authors = [
    "David Veszelovszki <veszelovszki@gmail.com>",
    "Dmitry Tretyakov <dtretyakov@gmail.com>",
]
description = "Universal MTP file transfer CLI built on mtp-rs"
keywords = ["mtp", "cli", "android", "garmin", "kindle"]
categories = ["command-line-utilities", "filesystem"]
readme = "README.md"
documentation = "https://docs.rs/mtp-rs-cli"

[[bin]]
name = "mtp-rs"
path = "src/main.rs"
# The bin target's rustdoc output dir (`mtp_rs`) collides with the lib crate's,
# and `cargo doc` racily corrupts the docs (rust-lang/cargo#6313; flaky CI
# failures). The bin has no doc content anyway (no `//!`, no public items), and
# docs.rs shows the crate page for bin-only crates regardless.
doc = false

[dependencies]
# `tracing` feature on: the CLI is the reporter tool, so it emits the library's
# device-protocol diagnostics (see `--trace` / `RUST_LOG`).
mtp-rs = { version = "0.30.0", path = "../mtp-rs", features = ["tracing"] }

clap = { version = "4.5", features = ["derive"] }
bytes = "1.5"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time", "fs", "io-util"] }
# Renders the library's `tracing` events to stderr for `--trace` / `RUST_LOG`.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
mtp-rs = { path = "../mtp-rs", features = ["virtual-device"] }
serde_json = "1"
tempfile = "3"

[features]
default = []
# Enable to wire the test-only virtual device registration in main.rs.
# Requires mtp-rs to be built with the virtual-device feature.
virtual-device = ["mtp-rs/virtual-device"]
